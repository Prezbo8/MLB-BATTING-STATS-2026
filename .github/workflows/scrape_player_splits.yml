name: Scrape FanGraphs Player Splits

on:
  schedule:
    # Backup only (Round H1): keeper starts it 7:00 AM ET; backups 8:13 / 11:13 AM EDT.
    - cron: '13 12 * * *'
    - cron: '13 15 * * *'
  workflow_dispatch:
    inputs:
      pretend_date:
        description: "Pretend today is YYYY-MM-DD (rehearsals; empty = really today)"
        required: false
        default: ""

permissions:
  actions: read     # job 'check' looks up today's earlier runs
  contents: write   # lets the built-in GITHUB_TOKEN update _ALL_PLAYER_SPLITS_COMBINED.csv

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false   # a second run waits for the first instead of overlapping

jobs:
  # The second (retry) schedule only does work if today's first run failed —
  # FanGraphs sometimes blocks GitHub's servers for a few hours (403s).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read     # looks up this workflow's earlier runs
      contents: read
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/backup_check.py --workflow scrape_player_splits.yml --since today

  scrape:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60   # scrape takes ~2 min; headroom for the 45-min retry budget

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas==3.1.1 requests==2.34.2

      - name: Run scraper
        env:
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MLB_TODAY:        ${{ inputs.pretend_date }}   # empty on schedules = really today
        run: python scripts/scrape_player_splits.py
