name: Scrape FanGraphs Player Splits

on:
  schedule:
    # Daily at 11:00 UTC (7 AM EDT) — player splits run in the 7-9 AM ET window
    - cron: '0 11 * * *'
    # Retry 15:00 UTC — runs only if the first run failed (see job 'check')
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      pretend_date:
        description: "Pretend today is YYYY-MM-DD (rehearsals; empty = really today)"
        required: false
        default: ""

permissions:
  actions: read     # job 'check' looks up today's earlier runs
  contents: write   # lets the built-in GITHUB_TOKEN update _ALL_PLAYER_SPLITS_COMBINED.csv

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false   # a second run waits for the first instead of overlapping

jobs:
  # The second (retry) schedule only does work if today's first run failed —
  # FanGraphs sometimes blocks GitHub's servers for a few hours (403s).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 15 * * *" ]; then
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow scrape_player_splits.yml --status success \
                  --created ">=$(date -u +%F)" --json databaseId --jq length)
            if [ "$n" -gt 0 ]; then
              echo "Today's first run already succeeded — skipping the retry"
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  scrape:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60   # scrape takes ~2 min; headroom for the 45-min retry budget

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas==3.1.1 requests==2.34.2

      - name: Run scraper
        env:
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MLB_TODAY:        ${{ inputs.pretend_date }}   # empty on schedules = really today
        run: python scripts/scrape_player_splits.py
