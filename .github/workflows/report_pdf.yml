name: Daily Report Summary → Telegram

# Sends a prose scouting-note text message per game to Telegram, built from the
# live site's data. 15:30 UTC ≈ 11:30 AM ET (after lineups/probable pitchers
# post). Run manually any time via "Run workflow".
on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  report-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm install playwright@latest
          npx playwright install --with-deps chromium

      - name: Build game summaries and send to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/report_summary.js
