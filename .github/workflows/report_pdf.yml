name: Daily Report Summary → Telegram

# Sends a prose scouting-note text message per game to Telegram, built from the
# live site's data. 15:30 UTC ≈ 11:30 AM ET (after lineups/probable pitchers
# post). Run manually any time via "Run workflow".
on:
  schedule:
    # Backup only (Round H1): keeper starts it 11:00 AM ET; backup 12:13 PM EDT (skips if today's report already went out).
    - cron: '13 16 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false   # a second run waits for the first instead of overlapping

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read     # looks up this workflow's earlier runs
      contents: read
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/backup_check.py --workflow report_pdf.yml --since today

  report-summary:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest is Ubuntu 26.04 since Oct 2026, where Playwright can't install Chromium (Round H4)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm install playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Build game summaries and send to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/report_summary.js
