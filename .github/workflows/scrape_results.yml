name: Scrape MLB Results (final scores)

# Rebuilds data/results/results_<season>.csv from MLB's official schedule API
# (replaces the old local ~/2025_MLB_RESULTS.py cron job). Commits only when a
# score was added or changed, so offseason runs make no commits.
on:
  schedule:
    # Backup only (Round H1): keeper starts it 5:30 AM ET; backup 6:47 AM EDT.
    - cron: '47 10 * * *'
  workflow_dispatch:

permissions:
  contents: write   # lets the built-in GITHUB_TOKEN commit the CSV

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false   # a second run waits for the first instead of overlapping

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read     # looks up this workflow's earlier runs
      contents: read
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/backup_check.py --workflow scrape_results.yml --since today

  results:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests==2.34.2

      - name: Build results CSV
        run: python scripts/scrape_results.py

      - name: Commit if changed
        run: |
          git add data/results
          if git diff --cached --quiet; then
            echo "No new results"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update MLB results $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
