name: Scrape Lineups (RotoWire)

on:
  schedule:
    # Hourly, 15:00–02:00 UTC (covers 11 AM–9 PM ET year-round).
    # Was every 30 min (22/day) — GitHub throttles high-frequency schedules on
    # shared runners and was only delivering 2-5 of them. Offset to :17 because
    # the top of the hour is peak queue load and gets delayed the most.
    - cron: '17 15-23 * * *'
    - cron: '17 0,1 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false   # a second run waits for the first instead of overlapping

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install \
            playwright==1.63.0 \
            beautifulsoup4==4.15.0 \
            lxml==6.1.3 \
            pytz==2026.4 \
            requests==2.34.2 \
            supabase==2.31.0

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run scraper
        env:
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/scrape_lineups.py --force
          else
            python scripts/scrape_lineups.py
          fi

      - name: Upload debug HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rotowire-debug-html
          path: rotowire_debug.html
          retention-days: 2
