name: Scrape Lineups (RotoWire)

on:
  schedule:
    # Backup only (Round H1): keeper starts it every hour at :17, 11:17 AM-9:17 PM ET; backups at :47 skip if a run succeeded in the last 50 min.
    - cron: '47 15-23 * * *'
    - cron: '47 0,1 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false   # a second run waits for the first instead of overlapping

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read     # looks up this workflow's earlier runs
      contents: read
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/backup_check.py --workflow scrape_lineups.yml --since 50m

  scrape:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest is Ubuntu 26.04 since Oct 2026, where Playwright can't install Chromium (Round H4)
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install \
            playwright==1.63.0 \
            beautifulsoup4==4.15.0 \
            lxml==6.1.3 \
            pytz==2026.4 \
            requests==2.34.2 \
            supabase==2.31.0

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run scraper
        env:
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/scrape_lineups.py --force
          else
            python scripts/scrape_lineups.py
          fi

      - name: Upload debug HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rotowire-debug-html
          path: rotowire_debug.html
          retention-days: 2
